# Welcome to Jekyll!
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. Restart the server after editing this file.

# ─── Site Identity ───────────────────────────────────────────────────────────
title: huzairuje
email: muhammadhuzair@gmail.com
description: >-
  huzairuje blog posts — real-world backend engineering with Go, distributed
  systems, microservices, databases, and production war stories.
url: "https://huzairuje.github.io"
baseurl: ""
lang: en

# ─── Author ──────────────────────────────────────────────────────────────────
author:
  name: Muhammad Huzair
  email: muhammadhuzair@gmail.com
  twitter: Huzairuje
  url: https://huzairuje.github.io/portfolio

# ─── Social / SEO ────────────────────────────────────────────────────────────
twitter_username: Huzairuje
github_username: huzairuje

# jekyll-seo-tag social links
social:
  name: Muhammad Huzair
  links:
    - https://twitter.com/Huzairuje
    - https://github.com/huzairuje
    - https://huzairuje.github.io/portfolio

# ─── Build Settings ──────────────────────────────────────────────────────────
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Improve post excerpts for meta descriptions
excerpt_separator: "<!--more-->"

# ─── Minima Theme ────────────────────────────────────────────────────────────
minima:
  skin: dark
  header_pages:
    - about.markdown

# ─── Sitemap ─────────────────────────────────────────────────────────────────
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Muhammad Huzair
      image: /assets/og-default.png

# ─── Exclude from build ──────────────────────────────────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
  - Gemfile.bak
  - vendor/
  - .bundle/