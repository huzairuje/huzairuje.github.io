<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <style>
    .box { fill: #1f2937; stroke: #5fb3b3; stroke-width: 1.5; }
    .box-warn { fill: #1f2937; stroke: #fac863; stroke-width: 1.5; }
    .box-down { fill: #1f2937; stroke: #ec5f67; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .box-active { fill: #114b4b; stroke: #5fb3b3; stroke-width: 2; }
    .label { fill: #e5e9f0; font-weight: 600; }
    .sub { fill: #c0c5ce; font-size: 11px; }
    .arrow { stroke: #c0c5ce; stroke-width: 1.5; fill: none; }
    .arrow-active { stroke: #5fb3b3; stroke-width: 2; fill: none; }
    .arrow-repl { stroke: #fac863; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .pill { fill: #2b2f3a; stroke: #5fb3b3; }
    .pill-text { fill: #e5e9f0; font-weight: 700; font-size: 12px; }
    .title { fill: #e5e9f0; font-weight: 700; font-size: 14px; }
  </style>

  <!-- Title -->
  <text x="410" y="24" text-anchor="middle" class="title">High-availability stack: from DNS to disk</text>

  <!-- Clients -->
  <rect x="340" y="48" width="140" height="40" rx="6" class="box" />
  <text x="410" y="73" text-anchor="middle" class="label">clients (browsers, apps)</text>

  <!-- DNS -->
  <rect x="340" y="108" width="140" height="40" rx="6" class="box" />
  <text x="410" y="125" text-anchor="middle" class="label">DNS A record</text>
  <text x="410" y="140" text-anchor="middle" class="sub">api.example.com → VIP</text>

  <!-- VIP -->
  <ellipse cx="410" cy="180" rx="74" ry="20" class="pill" />
  <text x="410" y="184" text-anchor="middle" class="pill-text">VIP 10.0.0.100</text>

  <!-- LB pair -->
  <rect x="180" y="230" width="200" height="80" rx="6" class="box-active" />
  <text x="280" y="252" text-anchor="middle" class="label">lb-01  (MASTER)</text>
  <text x="280" y="270" text-anchor="middle" class="sub">HAProxy + Keepalived</text>
  <text x="280" y="286" text-anchor="middle" class="sub">VRRP priority 110 · holds VIP</text>
  <text x="280" y="302" text-anchor="middle" class="sub">net.ipv4.ip_nonlocal_bind = 1</text>

  <rect x="440" y="230" width="200" height="80" rx="6" class="box-warn" />
  <text x="540" y="252" text-anchor="middle" class="label">lb-02  (BACKUP)</text>
  <text x="540" y="270" text-anchor="middle" class="sub">HAProxy + Keepalived</text>
  <text x="540" y="286" text-anchor="middle" class="sub">VRRP priority 100 · idle</text>
  <text x="540" y="302" text-anchor="middle" class="sub">listening, no traffic</text>

  <!-- VRRP heartbeat -->
  <line x1="380" y1="270" x2="440" y2="270" class="arrow" stroke-dasharray="3 3" />
  <text x="410" y="263" text-anchor="middle" class="sub">VRRP</text>

  <!-- App tier -->
  <rect x="80" y="360" width="160" height="60" rx="6" class="box" />
  <text x="160" y="383" text-anchor="middle" class="label">app-01</text>
  <text x="160" y="400" text-anchor="middle" class="sub">stateless · scales horizontally</text>

  <rect x="330" y="360" width="160" height="60" rx="6" class="box" />
  <text x="410" y="383" text-anchor="middle" class="label">app-02</text>
  <text x="410" y="400" text-anchor="middle" class="sub">stateless · scales horizontally</text>

  <rect x="580" y="360" width="160" height="60" rx="6" class="box" />
  <text x="660" y="383" text-anchor="middle" class="label">app-03</text>
  <text x="660" y="400" text-anchor="middle" class="sub">stateless · scales horizontally</text>

  <!-- DB tier -->
  <rect x="160" y="470" width="220" height="70" rx="6" class="box-active" />
  <text x="270" y="493" text-anchor="middle" class="label">postgres-primary</text>
  <text x="270" y="510" text-anchor="middle" class="sub">accepts writes · streams WAL</text>
  <text x="270" y="526" text-anchor="middle" class="sub">synchronous_commit = on</text>

  <rect x="440" y="470" width="220" height="70" rx="6" class="box-warn" />
  <text x="550" y="493" text-anchor="middle" class="label">postgres-replica</text>
  <text x="550" y="510" text-anchor="middle" class="sub">hot standby · read-only</text>
  <text x="550" y="526" text-anchor="middle" class="sub">replays WAL continuously</text>

  <!-- Arrows: clients → DNS → VIP -->
  <line x1="410" y1="88" x2="410" y2="108" class="arrow" />
  <polygon points="410,108 406,100 414,100" fill="#c0c5ce" />

  <line x1="410" y1="148" x2="410" y2="160" class="arrow" />
  <polygon points="410,160 406,152 414,152" fill="#c0c5ce" />

  <!-- VIP → master -->
  <path d="M 380 192 Q 320 210 280 230" class="arrow-active" />
  <polygon points="280,230 286,222 290,230" fill="#5fb3b3" />

  <!-- master → app tier -->
  <line x1="240" y1="310" x2="170" y2="360" class="arrow-active" />
  <polygon points="170,360 176,354 180,362" fill="#5fb3b3" />
  <line x1="280" y1="310" x2="400" y2="360" class="arrow-active" />
  <polygon points="400,360 392,358 398,352" fill="#5fb3b3" />
  <line x1="320" y1="310" x2="640" y2="360" class="arrow-active" />
  <polygon points="640,360 632,360 636,353" fill="#5fb3b3" />

  <!-- apps → primary (writes) -->
  <line x1="160" y1="420" x2="240" y2="470" class="arrow-active" />
  <polygon points="240,470 234,464 232,472" fill="#5fb3b3" />
  <line x1="410" y1="420" x2="290" y2="470" class="arrow-active" />
  <polygon points="290,470 296,464 298,472" fill="#5fb3b3" />

  <!-- apps → replica (reads) -->
  <line x1="660" y1="420" x2="570" y2="470" class="arrow" />
  <polygon points="570,470 576,464 578,472" fill="#c0c5ce" />
  <text x="710" y="450" class="sub">read-only queries</text>

  <!-- WAL stream primary → replica -->
  <path d="M 380 505 L 440 505" class="arrow-repl" />
  <polygon points="440,505 432,501 432,509" fill="#fac863" />
  <text x="410" y="498" text-anchor="middle" class="sub">WAL stream</text>

  <!-- Legend -->
  <rect x="690" y="48" width="120" height="100" rx="6" class="box" />
  <text x="700" y="65" class="sub" font-weight="700" fill="#e5e9f0">legend</text>
  <line x1="700" y1="78" x2="730" y2="78" class="arrow-active" />
  <text x="736" y="82" class="sub">live traffic</text>
  <line x1="700" y1="96" x2="730" y2="96" class="arrow" />
  <text x="736" y="100" class="sub">control / read</text>
  <line x1="700" y1="114" x2="730" y2="114" class="arrow-repl" />
  <text x="736" y="118" class="sub">replication</text>
  <line x1="700" y1="132" x2="730" y2="132" class="arrow" stroke-dasharray="3 3" />
  <text x="736" y="136" class="sub">heartbeat</text>
</svg>
