<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <style>
    .box         { fill: #1f2937; stroke: #5fb3b3; stroke-width: 1.5; }
    .box-down    { fill: #1f2937; stroke: #ec5f67; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .box-active  { fill: #114b4b; stroke: #5fb3b3; stroke-width: 2; }
    .slot-active { fill: #114b4b; stroke: #5fb3b3; stroke-width: 1; }
    .slot-idle   { fill: #2b2f3a; stroke: #6b7280; stroke-width: 1; }
    .slot-wait   { fill: #3b1f1f; stroke: #ec5f67; stroke-width: 1; }
    .label       { fill: #e5e9f0; font-weight: 600; }
    .sub         { fill: #c0c5ce; font-size: 11px; }
    .arrow       { stroke: #c0c5ce; stroke-width: 1.5; fill: none; }
    .arrow-act   { stroke: #5fb3b3; stroke-width: 2; fill: none; }
    .arrow-red   { stroke: #ec5f67; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .title       { fill: #e5e9f0; font-weight: 700; font-size: 14px; }
  </style>
  <defs>
    <marker id="ah"     markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c0c5ce"/></marker>
    <marker id="ah-act" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#5fb3b3"/></marker>
    <marker id="ah-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ec5f67"/></marker>
  </defs>

  <!-- Title -->
  <text x="410" y="26" text-anchor="middle" class="title">Connection Pool — How SetMaxOpenConns Works</text>

  <!-- App -->
  <rect x="310" y="44" width="200" height="48" rx="6" class="box-active"/>
  <text x="410" y="64" text-anchor="middle" class="label">Your Go App</text>
  <text x="410" y="81" text-anchor="middle" class="sub">HTTP handlers / goroutines</text>
  <path d="M410 92 L410 124" class="arrow-act" marker-end="url(#ah-act)"/>

  <!-- Pool outer -->
  <rect x="40" y="126" width="740" height="248" rx="8" class="box"/>
  <text x="410" y="148" text-anchor="middle" class="label">Connection Pool</text>

  <!-- In Use -->
  <rect x="58" y="158" width="218" height="202" rx="6" class="box-active"/>
  <text x="167" y="176" text-anchor="middle" class="label" font-size="12">In Use (10)</text>
  <rect x="68"  y="184" width="34" height="22" rx="3" class="slot-active"/>
  <rect x="108" y="184" width="34" height="22" rx="3" class="slot-active"/>
  <rect x="148" y="184" width="34" height="22" rx="3" class="slot-active"/>
  <rect x="188" y="184" width="34" height="22" rx="3" class="slot-active"/>
  <rect x="228" y="184" width="34" height="22" rx="3" class="slot-active"/>
  <rect x="68"  y="212" width="34" height="22" rx="3" class="slot-active"/>
  <rect x="108" y="212" width="34" height="22" rx="3" class="slot-active"/>
  <rect x="148" y="212" width="34" height="22" rx="3" class="slot-active"/>
  <rect x="188" y="212" width="34" height="22" rx="3" class="slot-active"/>
  <rect x="228" y="212" width="34" height="22" rx="3" class="slot-active"/>
  <text x="167" y="252" text-anchor="middle" class="sub">actively running queries</text>
  <text x="167" y="267" text-anchor="middle" class="sub">held until query completes</text>
  <text x="167" y="296" text-anchor="middle" fill="#5fb3b3" font-size="11" font-weight="600">db.Stats().InUse</text>
  <text x="167" y="340" text-anchor="middle" class="sub">SetMaxOpenConns</text>
  <text x="167" y="355" text-anchor="middle" fill="#5fb3b3" font-size="11">controls total ceiling</text>

  <!-- Idle -->
  <rect x="296" y="158" width="228" height="202" rx="6" fill="#1e2533" stroke="#6b7280" stroke-width="1.5"/>
  <text x="410" y="176" text-anchor="middle" class="label" font-size="12">Idle (10)</text>
  <rect x="306" y="184" width="34" height="22" rx="3" class="slot-idle"/>
  <rect x="346" y="184" width="34" height="22" rx="3" class="slot-idle"/>
  <rect x="386" y="184" width="34" height="22" rx="3" class="slot-idle"/>
  <rect x="426" y="184" width="34" height="22" rx="3" class="slot-idle"/>
  <rect x="466" y="184" width="34" height="22" rx="3" class="slot-idle"/>
  <rect x="306" y="212" width="34" height="22" rx="3" class="slot-idle"/>
  <rect x="346" y="212" width="34" height="22" rx="3" class="slot-idle"/>
  <rect x="386" y="212" width="34" height="22" rx="3" class="slot-idle"/>
  <rect x="426" y="212" width="34" height="22" rx="3" class="slot-idle"/>
  <rect x="466" y="212" width="34" height="22" rx="3" class="slot-idle"/>
  <text x="410" y="252" text-anchor="middle" class="sub">warm, ready to reuse</text>
  <text x="410" y="267" text-anchor="middle" class="sub">no handshake overhead</text>
  <text x="410" y="296" text-anchor="middle" fill="#c0c5ce" font-size="11" font-weight="600">db.Stats().Idle</text>
  <text x="410" y="340" text-anchor="middle" class="sub">SetMaxIdleConns</text>
  <text x="410" y="355" text-anchor="middle" fill="#c0c5ce" font-size="11">controls this pool</text>

  <!-- Waiting -->
  <rect x="544" y="158" width="218" height="202" rx="6" fill="#1f1a2e" stroke="#ec5f67" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="653" y="176" text-anchor="middle" class="label" font-size="12">Waiting (5)</text>
  <rect x="554" y="184" width="34" height="22" rx="3" class="slot-wait"/>
  <rect x="594" y="184" width="34" height="22" rx="3" class="slot-wait"/>
  <rect x="634" y="184" width="34" height="22" rx="3" class="slot-wait"/>
  <rect x="674" y="184" width="34" height="22" rx="3" class="slot-wait"/>
  <rect x="714" y="184" width="34" height="22" rx="3" class="slot-wait"/>
  <text x="653" y="228" text-anchor="middle" class="sub">requests queued</text>
  <text x="653" y="243" text-anchor="middle" class="sub">waiting for a free slot</text>
  <text x="653" y="272" text-anchor="middle" fill="#ec5f67" font-size="11" font-weight="600">db.Stats().WaitCount ↑</text>
  <text x="653" y="316" text-anchor="middle" fill="#ec5f67" font-size="11">growing = pool too small</text>
  <text x="653" y="331" text-anchor="middle" fill="#ec5f67" font-size="11">or connections leaking</text>

  <!-- MaxOpenConns label -->
  <text x="410" y="392" text-anchor="middle" class="sub">MaxOpenConns = 25  (10 in use + 10 idle + 5 waiting)</text>

  <!-- Arrow Pool → DB -->
  <path d="M410 376 L410 408" class="arrow-act" marker-end="url(#ah-act)"/>

  <!-- DB -->
  <rect x="300" y="410" width="220" height="50" rx="6" class="box"/>
  <text x="410" y="431" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="410" y="448" text-anchor="middle" class="sub">max_connections = 100</text>

  <!-- New request blocked -->
  <rect x="590" y="410" width="190" height="50" rx="6" class="box-down"/>
  <text x="685" y="431" text-anchor="middle" fill="#ec5f67" font-weight="600" font-size="12">New Request</text>
  <text x="685" y="448" text-anchor="middle" class="sub">→ WAIT or timeout ❌</text>
  <path d="M590 435 L522 435" class="arrow-red" marker-end="url(#ah-red)"/>
</svg>
