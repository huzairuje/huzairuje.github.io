<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <style>
    .label { fill: #e5e9f0; font-weight: 600; }
    .sub   { fill: #c0c5ce; font-size: 11px; }
    .grid  { stroke: #1f2937; stroke-width: 1; stroke-dasharray: 4 3; }
    .axis  { stroke: #374151; stroke-width: 1; fill: none; }
    .title { fill: #e5e9f0; font-weight: 700; font-size: 14px; }
  </style>

  <!-- Title -->
  <text x="410" y="26" text-anchor="middle" class="title">Goroutine Count Over Time — The Silent Leak</text>

  <!-- Chart background -->
  <rect x="80" y="46" width="660" height="240" rx="4" fill="#111827"/>

  <!-- Grid lines -->
  <line x1="80" y1="104" x2="740" y2="104" class="grid"/>
  <line x1="80" y1="163" x2="740" y2="163" class="grid"/>
  <line x1="80" y1="222" x2="740" y2="222" class="grid"/>

  <!-- Y axis labels -->
  <text x="72" y="50"  text-anchor="end" class="sub">200k</text>
  <text x="72" y="108" text-anchor="end" class="sub">150k</text>
  <text x="72" y="167" text-anchor="end" class="sub">100k</text>
  <text x="72" y="226" text-anchor="end" class="sub">50k</text>
  <text x="72" y="290" text-anchor="end" class="sub">0</text>

  <!-- Y axis title -->
  <text x="16" y="170" text-anchor="middle" fill="#c0c5ce" font-size="11"
        transform="rotate(-90,16,170)">goroutines</text>

  <!-- X axis -->
  <line x1="80" y1="286" x2="740" y2="286" class="axis"/>

  <!-- X tick marks -->
  <line x1="80"  y1="286" x2="80"  y2="292" stroke="#374151" stroke-width="1"/>
  <line x1="245" y1="286" x2="245" y2="292" stroke="#374151" stroke-width="1"/>
  <line x1="410" y1="286" x2="410" y2="292" stroke="#374151" stroke-width="1"/>
  <line x1="575" y1="286" x2="575" y2="292" stroke="#374151" stroke-width="1"/>
  <line x1="740" y1="286" x2="740" y2="292" stroke="#374151" stroke-width="1"/>

  <!-- X axis labels -->
  <text x="80"  y="306" text-anchor="middle" class="sub">t = 0h</text>
  <text x="245" y="306" text-anchor="middle" class="sub">t = 1h</text>
  <text x="410" y="306" text-anchor="middle" class="sub">t = 2h</text>
  <text x="575" y="306" text-anchor="middle" class="sub">t = 3h</text>
  <text x="740" y="306" text-anchor="middle" class="sub">t = 4h</text>

  <!-- CPU flat line -->
  <line x1="80" y1="258" x2="740" y2="258"
        stroke="#5fb3b3" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="748" y="255" class="sub" fill="#5fb3b3">CPU</text>
  <text x="748" y="268" class="sub" fill="#5fb3b3">~12%</text>
  <text x="748" y="281" class="sub" fill="#5fb3b3">(flat)</text>

  <!-- Goroutine count line -->
  <!-- y = 286 - (count / 200000 * 240) -->
  <!-- 800   → 286-0.96  = 285 -->
  <!-- 4200  → 286-5.04  = 281 -->
  <!-- 18000 → 286-21.6  = 264 -->
  <!-- 61000 → 286-73.2  = 213 -->
  <!-- 180000→ 286-216   = 70  -->
  <polyline points="80,285 245,281 410,264 575,213 740,70"
            stroke="#ec5f67" stroke-width="2.5" fill="none"/>

  <!-- Data point dots -->
  <circle cx="80"  cy="285" r="4" fill="#ec5f67"/>
  <circle cx="245" cy="281" r="4" fill="#ec5f67"/>
  <circle cx="410" cy="264" r="4" fill="#ec5f67"/>
  <circle cx="575" cy="213" r="4" fill="#ec5f67"/>
  <circle cx="740" cy="70"  r="5" fill="#ec5f67"/>

  <!-- Data labels -->
  <text x="88"  y="280" class="sub" fill="#c0c5ce">800</text>
  <text x="253" y="276" class="sub" fill="#c0c5ce">4.2k</text>
  <text x="418" y="259" class="sub" fill="#c0c5ce">18k</text>
  <text x="583" y="208" class="sub" fill="#c0c5ce">61k</text>
  <text x="748" y="68"  class="sub" fill="#ec5f67" font-weight="600">180k</text>

  <!-- OOMKilled badge -->
  <rect x="636" y="50" width="100" height="26" rx="4" fill="#3b1f1f" stroke="#ec5f67" stroke-width="1"/>
  <text x="686" y="68" text-anchor="middle" fill="#ec5f67" font-size="11" font-weight="600">OOMKilled ❌</text>

  <!-- "healthy" annotation at t=0 -->
  <rect x="50" y="270" width="56" height="20" rx="3" fill="#114b4b" stroke="#5fb3b3" stroke-width="1"/>
  <text x="78" y="284" text-anchor="middle" fill="#5fb3b3" font-size="10" font-weight="600">healthy</text>

  <!-- Legend -->
  <line x1="80"  y1="338" x2="114" y2="338" stroke="#ec5f67" stroke-width="2.5"/>
  <circle cx="97" cy="338" r="4" fill="#ec5f67"/>
  <text x="120" y="342" class="sub">goroutine count (leaking)</text>

  <line x1="310" y1="338" x2="344" y2="338" stroke="#5fb3b3" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="350" y="342" class="sub">CPU usage % — flat, gives no warning</text>

  <!-- Key insight -->
  <text x="410" y="368" text-anchor="middle" fill="#fac863" font-size="11" font-weight="600">
    CPU looks healthy while memory silently climbs — the leak is invisible until it isn't
  </text>
</svg>
