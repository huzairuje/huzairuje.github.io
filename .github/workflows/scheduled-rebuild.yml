name: Scheduled rebuild for future-dated posts

# Why this exists:
#   _config.yml sets `future: false`, so jekyll build drops posts dated later
#   than build time. GitHub Pages only rebuilds on push, so a future-dated
#   post stays invisible until something triggers a new build *after* its
#   date passes. This workflow is that trigger.
#
# What it does:
#   Posts use `date: YYYY-MM-DD 08:00:00 +0700`, so the rebuild has to fire
#   *after* 08:00 Jakarta or `future: false` will still drop the post.
#   Runs at 08:10 and 09:10 Asia/Jakarta (01:10 and 02:10 UTC). Two slots
#   because GitHub Actions cron commonly slips 5–15 minutes; the second
#   run is a safety net. Looks at filenames in _posts/ and finds any post
#   whose date prefix is today in Asia/Jakarta. If one exists, pushes an
#   empty commit so GitHub Pages rebuilds and the post goes live.
#   Otherwise, exits without committing — no spam in the git log.

on:
  schedule:
    # 01:10 UTC == 08:10 Asia/Jakarta — just after 08:00 +0700 posts
    - cron: "10 1 * * *"
    # 02:10 UTC == 09:10 Asia/Jakarta — safety net for cron slippage
    - cron: "10 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a rebuild even if no post matches today"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: scheduled-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find posts going live today (Asia/Jakarta)
        id: check
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Jakarta date +%Y-%m-%d)"
          echo "today=$today" >> "$GITHUB_OUTPUT"

          # Match _posts/YYYY-MM-DD-*.markdown or .md where YYYY-MM-DD == today
          matches="$(ls _posts/ 2>/dev/null | grep -E "^${today}-.+\.(markdown|md)$" || true)"

          if [ -n "$matches" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Posts going live today:"
            echo "$matches"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No posts dated $today. Nothing to publish."
          fi

      - name: Push empty commit to trigger Pages rebuild
        if: steps.check.outputs.found == 'true' || github.event.inputs.force == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: scheduled rebuild for ${{ steps.check.outputs.today }}"
          git push
