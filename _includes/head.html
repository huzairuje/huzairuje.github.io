<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- seo -%}

  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}

  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  {%- if page.layout == 'post' -%}
  <!-- JSON-LD: BlogPosting structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": {{ page.title | jsonify }},
    "description": {{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | jsonify }},
    "url": {{ page.url | absolute_url | jsonify }},
    "datePublished": "{{ page.date | date_to_xmlschema }}",
    "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
    "author": {
      "@type": "Person",
      "name": {{ site.author.name | default: site.author | jsonify }},
      "url": {{ site.author.url | default: site.url | jsonify }}
    },
    "publisher": {
      "@type": "Person",
      "name": {{ site.author.name | default: site.title | jsonify }},
      "url": {{ site.url | jsonify }}
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": {{ page.url | absolute_url | jsonify }}
    },
    "keywords": {{ page.tags | join: ", " | jsonify }}
  }
  </script>
  {%- else -%}
  <!-- JSON-LD: Website/Person structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Blog",
    "name": {{ site.title | jsonify }},
    "description": {{ site.description | jsonify }},
    "url": {{ site.url | jsonify }},
    "author": {
      "@type": "Person",
      "name": {{ site.author.name | default: site.title | jsonify }},
      "url": {{ site.author.url | default: site.url | jsonify }},
      "sameAs": [
        "https://twitter.com/{{ site.twitter_username }}",
        "https://github.com/{{ site.github_username }}",
        "https://huzairuje.github.io/portfolio"
      ]
    }
  }
  </script>
  {%- endif -%}
</head>
